name: Generate technical examples

on:
  push:
    branches: [main]
    paths:
      - "tools/generate_technical_examples.py"
      - ".github/workflows/generate-technical-examples.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate missing technical examples
        run: python tools/generate_technical_examples.py

      - name: Commit generated examples
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "GaneshRacha"
          git config user.email "60355360+GaneshRacha@users.noreply.github.com"
          git add .
          git commit -m "Add technical examples across documented patterns"
          git push
